<div class="row mt-3">
  <div class="col-lg-6">
    <h3>LJM-Listado de Comentarios</h3>
  </div>

  <div class="col-lg-6">
    <button class="btn btn-secondary float-end" routerLink="/ljmagregar">
      Nuevo Comentario LJM
    </button>
  </div>
</div>

<table *ngIf="ljmlistComentarios.length > 0" class="table table-hover mt-3">
  <thead>
    <td>ljmTitulo</td>
    <td>ljmCreador</td>
    <td>ljmfecha</td>
    <td>ljm</td>
    <td>ljm</td>
  </thead>
  <tbody>
    <tr *ngFor="let comentario of ljmlistComentarios">
      <td>
        <a [routerLink]="['/ljmver', comentario.id]">
          {{ comentario.ljmtitulo }}
        </a>
      </td>
      <td>{{ comentario.ljmcreador }}</td>
      <td>{{ comentario.ljmfechaCreacion | date : "dd/MM/yyyy" }}</td>
      <td>{{ comentario.ljmtexto }}</td>
      <td style="width: 10%">
        <button
          [routerLink]="['/ljmeditar', comentario.id]"
          class="btn btn-success btn-sm float-end"
        >
          Editar
        </button>
      </td>
      <td style="width: 10%">
        <button
          (clic)="LJMeliminarComentario(comentario.id)"
          class="btn btn-danger btn-sm float-end"
        >
          Eliminar
        </button>
      </td>
    </tr>
    <!-- <tr>
      <td>Angular</td>
      <td>Luis</td>
      <td>31/20/24</td>
      <td>ljm</td>
      <td>ljm</td>
    </tr> -->
  </tbody>
</table>
